name: Autonomous Developer Search Gap Radar

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Target developer category (or "All")'
        required: false
        default: 'All'

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests httpx pydantic

      - name: Run Radar Sweep (Zero-Cost Dual-Evidence Sieve)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python radar_daemon.py --once

      - name: Commit and push updated database & daily reports
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/niche_gaps.db reports/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(radar): autonomous search gap sweep update [skip ci]"
          git push
