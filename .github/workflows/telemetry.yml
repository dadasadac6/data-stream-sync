name: Ecosystem Telemetry & Matrix Dependency Audit

on:
  schedule:
    # High-frequency 15-minute continuous rolling schedule
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      max_batches:
        description: 'Matrix batch exploration limit'
        required: false
        default: '3'

jobs:
  telemetry-probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard_id: [16, 17, 18, 19]
      max-parallel: 4
      fail-fast: false
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout telemetry ecosystem
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure runner telemetry security
        env:
          COOKIE_DATA: ${{ secrets.TELEMETRY_COOKIE_POOL || secrets.TRENDS_COOKIE_POOL }}
        run: |
          if [ -n "$COOKIE_DATA" ]; then
            echo "::add-mask::$COOKIE_DATA"
          fi

      - name: Execute ecosystem integration probe
        env:
          TELEMETRY_COOKIE_POOL: ${{ secrets.TELEMETRY_COOKIE_POOL || secrets.TRENDS_COOKIE_POOL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STACKAPPS_KEY: ${{ secrets.STACKAPPS_KEY }}
          SHARD_ID: ${{ matrix.shard_id }}
          TOTAL_SHARDS: 20
        run: |
          python3 -m engines.probe_worker \
            --shard-id $SHARD_ID \
            --total-shards $TOTAL_SHARDS \
            --max-batches ${{ github.event.inputs.max_batches || '3' }}

      - name: Sync telemetry artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "Ecosystem Telemetry CI"
          git config --local user.email "ci@ecosystem-telemetry.local"
          git add storage/telemetry_matrix.db reports/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(ci): sync ecosystem telemetry shard-${{ matrix.shard_id }} [skip ci]"
          git pull --rebase origin main || true
          git push || true

      - name: Dispatch next continuous rolling cycle (Fresh VM & IP)
        if: matrix.shard_id == 16 || matrix.shard_id == 0 || matrix.shard_id == 4 || matrix.shard_id == 8 || matrix.shard_id == 12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⚡ Triggering next rolling wave for continuous fresh VM execution..."
          sleep 15
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/telemetry.yml/dispatches \
            -d '{"ref":"main","inputs":{"max_batches":"3"}}' || true
